#
# themin'
#

# dark_gray="#212121"
# medium_gray="#444444"


dark_gray="#282828"     # touch brighter than Base 00
medium_gray="#444444"   # Base 02
light_gray="#606060"
light_white="#F5F4F1"  # Base 06
dim_white="#747164"     # Base 03
active_white="#96917B"  # Base 04
light_purp="#C792EA"  # Base 0E
dark_purp="#8562D4"

set-option -g status-left-length 40
set-option -g status-right-length 40
set-option -g status-interval 5
set-option -g status-justify left

# status bar
set-option -g status-style "bg=$dark_gray"
set-option -g window-status-style "none,fg=$dim_white,bg=$dark_gray"
set-option -g window-status-activity-style "bold,fg=$dark_purp,bg=$dark_gray"
set-option -g window-status-bell-style "bold,fg=$dark_purp,bg=$dark_gray"
set-option -g window-status-separator ""

# panes
set-option -g pane-border-style "fg=$dim_white"
set-option -g pane-active-border-style "fg=$light_purp"
set-option -g popup-style "default"

# messages
set-option -g message-style "fg=$dark_gray,bg=$dark_purp,fill=$dark_purp"
set-option -g message-command-style "fg=$dark_gray,bg=$dark_purp,fill=$dark_purp"

# scrollback selection + position label
set-option -g mode-style "bg=$dark_purp,fg=$light_white,bold"
set-option -g copy-mode-selection-style "bg=$dark_purp,fg=$light_white,bold"
set-option -g copy-mode-position-style "bg=$dark_purp,fg=$light_white,bold"
set-option -g tree-mode-selection-style "bg=$dark_purp,fg=$light_white,bold"

# tmux-fingers: muted blue targets, purple matches, and green multi-selections
set-option -g @fingers-hint-style "fg=colour252,bg=colour60,bold"
set-option -g @fingers-highlight-style "fg=colour176"
set-option -g @fingers-backdrop-style "fg=colour242,dim"
set-option -g @fingers-selected-hint-style "fg=colour235,bg=colour150,bold"
set-option -g @fingers-selected-highlight-style "fg=colour255,bold"

# window status formats
set-option -g window-status-format "#[fg=$dark_gray,bg=$dark_gray,nobold,nounderscore,noitalics]#[default] #I #W #[fg=$dark_gray,bg=$dark_gray,nobold,nounderscore,noitalics]"
set-option -g window-status-current-format "#[fg=$dark_gray,bg=$medium_gray,nobold,nounderscore,noitalics]#[fg=$active_white,bg=$medium_gray,nobold] #I #W #[fg=$medium_gray,bg=$dark_gray,nobold,nounderscore,noitalics]"

# status L+R
set-option -g status-left "#[fg=$dark_gray,bg=$light_gray,nobold] #S #[fg=$light_gray,bg=$dark_gray,nobold,nounderscore,noitalics]"
set-option -g status-right "#[fg=$dark_gray,bg=$dark_gray,nobold,nounderscore,noitalics]#[fg=$dim_white,bg=$dark_gray] #[fg=$medium_gray,bg=$dark_gray,nobold,nounderscore,noitalics]#[fg=$active_white,bg=$medium_gray] %R #[fg=$dark_purp,bg=$medium_gray,nobold,nounderscore,noitalics]#[fg=$dark_gray,bg=$dark_purp,bold] #h "
