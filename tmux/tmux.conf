TMUX_DIR="~/.config/tmux"

#
# opts
#



# maus
set-option -g mouse on

# scroll three lines per wheel tick
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -N3 -X scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -N3 -X scroll-down
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -N3 -X scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -N3 -X scroll-down

# ain't nobody wanna to reach that far
set-option -g base-index 1
set-window-option -g pane-base-index 1

# rename window to reflect current program
set-window-option -g automatic-rename on

# renumber windows when a window is closed
set-option -g renumber-windows on

# set terminal title
set-option -g set-titles on

# gimme more time to select a pane #
set-window-option -g display-panes-time 2000

# slightly longer status messages display time
set-option -g display-time 1000

# activity
set-window-option -g monitor-activity on
set-option -g visual-activity off

#
# keybindin'
#

# ctrl-space prefix
set -g prefix C-Space
bind Space send-prefix

# "clear"
# doesn't *quite* work, leaves a few lines in scrollback? :/
bind-key C-e send-keys 'C-l' \; clear-history \; display "clear!"

# double-prefix goes to previous window
bind-key C-b last-window

# create new windows @ same path
bind-key c new-window -c '#{pane_current_path}'

# vi copy mode: visual and visual-block selections
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# vi paste buffers: paste the latest buffer or choose an older buffer
bind-key p paste-buffer
bind-key P choose-buffer -Z

# verical / horizontal pane zoomin' focus
# modified from https://willcodefor.beer/posts/tmuxmax
bind-key a if -F '#{@layout_save}' \
  {run-shell "tmux select-layout '#{@layout_save}' ; tmux set -up @layout_save"} \
  {set -Fp @layout_save "#{window_layout}" ; resize-pane -y 100%}

bind-key A if -F '#{@layout_save}' \
  {run-shell "tmux select-layout '#{@layout_save}' ; tmux set -up @layout_save"} \
  {set -Fp @layout_save "#{window_layout}" ; resize-pane -x 100%}

# equalize panes
# map prefix-e to same as prefix-E for fewer keys
bind-key e select-layout -E

# reload tmux.cong
bind-key r source-file "${TMUX_DIR}/tmux.conf" \; display "r-r-r-reload!"

# popups
bind-key t display-popup -w 90% -h 90% -E "htop"
bind-key g display-popup -d '#{pane_current_path}' -E -w 90% -h 90% "lazygit"

#
# themin'
#
source "${TMUX_DIR}/theme.conf"

#
# automatic session storage + restoring
#
set -g @resurrect-dir "${TMUX_DIR}/resurrect"
set -g @continuum-restore 'on'

#
# plugin'
# install via `C-Space I`
#
set -g @tpm_plugins "                   \
    tmux-plugins/tpm                    \
    tmux-plugins/tmux-sensible          \
    tmux-plugins/tmux-pain-control      \
    tmux-plugins/tmux-yank              \
    tmux-plugins/tmux-resurrect         \
    tmux-plugins/tmux-continuum         \
    christoomey/vim-tmux-navigator      \
    Morantron/tmux-fingers
"
run "${TMUX_DIR}/plugins/tpm/tpm"

# tmux-sensible bulldozes my vi mode opts :/
set-window-option -g mode-keys vi
set-option -g status-keys vi
